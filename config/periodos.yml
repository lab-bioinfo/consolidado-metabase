# =============================================================================
# config/periodos.yml
# -----------------------------------------------------------------------------
# Mapeo de columnas fuente por (unidad, año, pestaña) construido EXCLUSIVAMENTE
# a partir de los 5 TSV observados en data/input/ (ver docs/data-profile.md).
#
# Convenciones:
#   - Las claves de `unidades` coinciden con el token <UNIDAD> de la columna
#     ARCHIVO_ORIGEN, cuyo patrón es `DDD_<UNIDAD>_<AÑO>_V2.XLSX`.
#   - Cada bloque se identifica por año (clave) y pestaña (PESTANA_ORIGEN).
#   - `granularidad: mensual`  -> el bloque 2022 tiene columnas mensuales;
#     las unidades se dan en `columnas.unidades_mensuales` (lista ordenada).
#   - `granularidad: agregado` -> una sola columna de consumo en
#     `columnas.unidades`.
#   - `columnas.gramos_archivo`, `columnas.densidad_archivo`, `columnas.precio`,
#     `columnas.gasto` son `null` cuando el bloque no las trae.
#   - `etiquetas_observadas` recoge los valores reales de PERIODO vistos en el
#     bloque (incluye variantes de texto y celdas vacías).
#   - `anomalias` documenta interpretaciones no estándar; no se corrige en silencio.
# =============================================================================

